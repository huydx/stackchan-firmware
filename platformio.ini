[env:stackchan-realtime]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.maximum_size = 1441792
monitor_speed = 115200
extra_scripts = pre:launcher_build.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wl,--wrap=nvs_flash_init
    -Wl,--wrap=nvs_flash_init_partition
    -Wl,--wrap=nvs_flash_erase
    -Wl,--wrap=nvs_flash_erase_partition
    -Wl,--wrap=nvs_open
    -Wl,--wrap=nvs_open_from_partition
    -Wl,--wrap=esp_wifi_init
lib_deps =
    https://github.com/m5stack/M5Unified.git#44952cb8e4ac88bf04ad23b9dfd6f4b05c788348
    m5stack/M5GFX@0.2.35
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.6.1
